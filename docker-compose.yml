# HydraSmart API — banco de dados e API em containers.
#
# Na máquina local (feira):  docker compose up -d db      -> só o PostgreSQL; a API roda com `npm run dev`
#                            (a API precisa rodar fora do Docker para acessar a porta USB do Arduino no Windows)
# Na VPS:                    docker compose up -d --build -> PostgreSQL + API
#
# A rede "hydrasmart" é compartilhada com o repositório HydraSmartFront (nginx faz proxy para a API).

name: hydrasmart-api

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hydrasmart}
      POSTGRES_USER: ${POSTGRES_USER:-hydrasmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydrasmart}
      TZ: America/Sao_Paulo
    ports:
      # Exposto só para a própria máquina (127.0.0.1), nunca para a internet.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [hydrasmart]

  api:
    build: .
    image: hydrasmart-api:latest
    restart: unless-stopped
    profiles: [completo]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://${POSTGRES_USER:-hydrasmart}:${POSTGRES_PASSWORD:-hydrasmart}@db:5432/${POSTGRES_DB:-hydrasmart}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SERIAL_ENABLED: "false"
      # Chaves privadas vindas do .env da VPS (nunca versionar).
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      PROTOTYPE_INGEST_API_KEY: ${PROTOTYPE_INGEST_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ENABLE_AUTOMATIC_AI: ${ENABLE_AUTOMATIC_AI:-false}
      ENABLE_PUBLIC_AI: ${ENABLE_PUBLIC_AI:-false}
      CEMADEN_JWT_TOKEN: ${CEMADEN_JWT_TOKEN:-}
      ENABLE_AI_TEST: ${ENABLE_AI_TEST:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/meta/llama-3.1-8b-instruct}
      CEMADEN_EMAIL: ${CEMADEN_EMAIL:-}
      CEMADEN_PASSWORD: ${CEMADEN_PASSWORD:-}
      MUNICIPIO_NOME: ${MUNICIPIO_NOME:-Porto Alegre - RS}
      MUNICIPIO_LATITUDE: ${MUNICIPIO_LATITUDE:--30.0346}
      MUNICIPIO_LONGITUDE: ${MUNICIPIO_LONGITUDE:--51.2177}
      MUNICIPIO_TIMEZONE: ${MUNICIPIO_TIMEZONE:-America/Sao_Paulo}
      TZ: ${MUNICIPIO_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    networks: [hydrasmart]

volumes:
  dados_postgres:

networks:
  hydrasmart:
    name: hydrasmart
